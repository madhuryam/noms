name = "noms"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets from web build
[assets]
directory = "../web/dist"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "single-page-application"

[dev]
port = 8787

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "noms-db"
database_id = "6a6ae1f3-8d4c-4260-af1f-f0a95788a99c"
migrations_dir = "migrations"

# R2 Bucket for recipe images (enable R2 in Cloudflare Dashboard first)
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "noms-images"
